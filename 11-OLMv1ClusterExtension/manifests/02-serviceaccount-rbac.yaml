# cluster-admin aqui é só pra fins didáticos (ver aviso no README, Passo 2) -- em produção,
# derive o RBAC mínimo real que o rhacs-operator precisa em vez de usar isto.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhacs-operator-v1-installer
  namespace: rhacs-operator-v1-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhacs-operator-v1-installer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: rhacs-operator-v1-installer
    namespace: rhacs-operator-v1-demo
