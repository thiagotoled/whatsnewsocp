apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-latest-tag
  labels:
    app: app-latest-tag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-latest-tag
  template:
    metadata:
      labels:
        app: app-latest-tag
    spec:
      containers:
        - name: app
          # Usa a tag "latest" de propósito, para violar a política padrão
          # "Latest tag" e servir de alvo de teste do escopo da política.
          # command sobrescrito: o entrypoint padrão do nginx tenta escrever em
          # /var/cache/nginx e quebra sob a SCC restricted (UID não-root aleatório) --
          # confirmado ao vivo (CrashLoopBackOff). Só precisamos da imagem/tag no cluster
          # pro RHACS avaliar a política, não precisa servir nada de verdade.
          image: docker.io/library/nginx:latest
          command: ["sleep", "infinity"]
