# O principal só propaga um AppProject cujos destinations/sourceNamespaces batem com a
# configuração do agent -- sem wildcard aqui, o agent não acha o AppProject e a Application
# fica travada. Confirmado no guia oficial (RHACM 2.17 GitOps, seção 1.14).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: openshift-gitops
spec:
  sourceNamespaces:
    - '*'
  destinations:
    - name: '*'
      namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - '*'
