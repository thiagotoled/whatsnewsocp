# Modelo pull (Argo CD Agent): mesmo ApplicationSet/Placement do modelo push (reusa o
# placement-argocd-agent-demo do 01-appset-push-model.yaml), só muda o destination.server --
# em vez do endpoint da API de cada managed cluster ({{server}}), aponta pro load balancer do
# principal (roda no hub), com o nome do cluster como query param. Quem efetivamente puxa e
# aplica é o agent rodando NO managed cluster, não o Argo CD do hub.
#
# Troque <PRINCIPAL_LB_HOST> pelo endereço do LoadBalancer criado pelo addon (oc get svc -n
# argocd | grep principal) -- é o mesmo pra toda a turma, não precisa de valor por aluno.
# {{name}} já resolve sozinho pro nome de CADA managed cluster que casar com o Placement, então
# uma turma inteira aplicando este mesmo ApplicationSet gera uma Application por aluno, sem
# colisão de nome.
#
# Mesmo namespace (openshift-gitops) e mesmo acm-placement/Placement do 01-appset-push-model.yaml
# de propósito -- não testado ao vivo ainda se o Argo CD Agent exige um namespace específico
# (`argocd`) pra rotear Applications pro agent certo; confirme isso na prática antes de assumir.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appdemo-pull
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: placement-argocd-agent-demo
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'appdemo-pull-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/thiagotoled/whatsnewsocp.git
        targetRevision: main
        path: 8-GitOpsArgoAgent/manifests/app
      destination:
        server: 'https://<PRINCIPAL_LB_HOST>:443?agentName={{name}}'
        namespace: gitops-agent-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
