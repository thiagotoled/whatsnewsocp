# Lab 2 - ExternalSecretsOperator: a lição é a sincronização (pull e push).
# Só o operador instalado é boilerplate.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab02
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab02-namespaces
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: eso-demo
        - complianceType: musthave
          objectDefinition:
            apiVersion: project.openshift.io/v1
            kind: Project
            metadata:
              name: external-secrets-operator
              labels:
                kubernetes.io/metadata.name: external-secrets-operator
            spec:
              finalizers:
                - kubernetes
  - extraDependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: ConfigurationPolicy
      name: policy-lab02-namespaces
    objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab02-operator-install
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: operators.coreos.com/v1
            kind: OperatorGroup
            metadata:
              name: openshift-external-secrets-operator
              namespace: external-secrets-operator
            spec:
              targetNamespaces: []
        - complianceType: musthave
          objectDefinition:
            apiVersion: operators.coreos.com/v1alpha1
            kind: Subscription
            metadata:
              name: openshift-external-secrets-operator
              namespace: external-secrets-operator
            spec:
              channel: stable-v1
              name: openshift-external-secrets-operator
              source: redhat-operators
              sourceNamespace: openshift-marketplace
              installPlanApproval: Automatic
              startingCSV: external-secrets-operator.v1.0.0
