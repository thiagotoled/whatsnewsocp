# Lab 1 - InplacePodverticalscaling: a lição é o "oc patch --subresource=resize".
# Namespace + Deployment já rodando são só prep.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab01
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab01
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-inplace-scaling
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: nginx-inplace
              namespace: lab-inplace-scaling
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: nginx-inplace
              template:
                metadata:
                  labels:
                    app: nginx-inplace
                spec:
                  containers:
                  - name: nginx
                    image: quay.io/packit/nginx-unprivileged:latest
                    ports:
                    - containerPort: 8080
                    resources:
                      requests:
                        cpu: "100m"
                        memory: "128Mi"
                      limits:
                        cpu: "200m"
                        memory: "256Mi"
                    resizePolicy:
                    - resourceName: cpu
                      restartPolicy: NotRequired
                    - resourceName: memory
                      restartPolicy: NotRequired
