# Lab 7 - PolicyDebugPodAttach: a lição é rodar oc debug/attach e ver o RHACS reagir.
# Namespace + deployment são só prep.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab07
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab07
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-acs-debug-attach
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: target-app
              namespace: lab-acs-debug-attach
              labels:
                app: target-app
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: target-app
              template:
                metadata:
                  labels:
                    app: target-app
                spec:
                  containers:
                    - name: app
                      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
                      command: ["sleep", "infinity"]
