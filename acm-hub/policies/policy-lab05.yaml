# Lab 5 - VulnerabilityManagementReporting: a lição é gerar/ler o relatório (03-report-on-demand.sh).
# Namespace + deployment vulnerável são só prep para existir CVE pra reportar.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab05
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab05
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-acs-vuln-reporting
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: legacy-nginx
              namespace: lab-acs-vuln-reporting
              labels:
                app: legacy-nginx
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: legacy-nginx
              template:
                metadata:
                  labels:
                    app: legacy-nginx
                spec:
                  containers:
                    - name: nginx
                      # Imagem propositalmente desatualizada, com CVEs conhecidas,
                      # apenas para gerar dados de vulnerabilidade no ACS.
                      image: docker.io/library/nginx:1.14.0
                      ports:
                        - containerPort: 80
