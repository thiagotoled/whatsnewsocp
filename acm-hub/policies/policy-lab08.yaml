# Lab 8 - GrafanaToPerses (Parte 1, COO genérico): a lição é o fluxo do Perses
# (UIPlugin/PersesGlobalDatasource/PersesDashboard). Operador instalado + namespace do demo são
# boilerplate. Confirmado ao vivo que sem o Cluster Observability Operator instalado, o
# UIPlugin falha com "no matches for kind UIPlugin in version observability.openshift.io/v1alpha1".
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab08
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab08-namespaces
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-perses-demo
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: openshift-cluster-observability-operator
  - extraDependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: ConfigurationPolicy
      name: policy-lab08-namespaces
    objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab08-operator-install
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: operators.coreos.com/v1
            kind: OperatorGroup
            metadata:
              name: openshift-cluster-observability-operator
              namespace: openshift-cluster-observability-operator
            spec:
              targetNamespaces: []
        - complianceType: musthave
          objectDefinition:
            apiVersion: operators.coreos.com/v1alpha1
            kind: Subscription
            metadata:
              name: cluster-observability-operator
              namespace: openshift-cluster-observability-operator
            spec:
              channel: stable
              name: cluster-observability-operator
              source: redhat-operators
              sourceNamespace: openshift-marketplace
              installPlanApproval: Automatic
              startingCSV: cluster-observability-operator.v1.5.1
