# As 6 policies de baseline dos labs vão aqui porque hoje nenhuma tem nada específico de
# nuvem (é só namespace/deployment/operador — roda igual em Azure ou VMware). Quando uma
# policy de lab precisar valer só numa nuvem, tira o subject daqui e cria/edita um
# PlacementBinding apontando pro placement-vmware-lab-clusters (05-placement-vmware.yaml) só
# com essa policy. Para Azure: o 04-placement-azure.yaml foi repurposado pra "qualquer cluster
# Azure, incluindo o hub" (usado pelo oauth) — se precisar de "só lab clusters Azure", crie
# um placement novo em vez de reusar esse.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-all-lab-clusters
  namespace: whatsnewsocp-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-all-lab-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab01
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab02
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab03
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab05
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab06
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab08
