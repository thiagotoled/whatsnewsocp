# As 8 policies de baseline dos labs vão aqui porque hoje nenhuma tem nada específico de
# nuvem (é só namespace/deployment/operador — roda igual em Azure ou VMware). Quando uma
# policy de lab precisar valer só numa nuvem, tira o subject daqui e cria/edita um
# PlacementBinding apontando pro placement-azure-lab-clusters ou placement-vmware-lab-clusters
# (04-placement-azure.yaml / 05-placement-vmware.yaml) só com essa policy.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: binding-all-lab-clusters
  namespace: whatsnewsocp-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-all-lab-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab01-inplace-pod-vertical-scaling-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab02-external-secrets-operator-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab03-user-namespaces-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab05-vulnerability-management-reporting-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab06-policy-scope-labels-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab07-policy-debug-pod-attach-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab09-upgrade-recommend-precheck-baseline
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: policy-lab09-upgrade-recommend-precheck-pdb-seed
