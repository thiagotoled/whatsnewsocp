# ESO rodando no HUB (diferente do Lab 2, que instala ESO em cada managed cluster/spoke) --
# sincroniza do Key Vault pro namespace whatsnewsocp-policies os dois secrets que antes eram
# aplicados manualmente por arquivo fora do repo (secret-htpasswd.yaml, secret-aad-client.yaml).
# O fromSecret do policy-oauth-configuration continua lendo os MESMOS nomes/chaves de Secret
# (htpasswd-2cr76/htpasswd, aad-client-secret/clientSecret) -- só muda quem os mantém
# atualizados. Reusa o SPN azure-eso-spn já aplicado manualmente no hub (mesmo usado pelo
# policy-lab02 pra distribuir pros spokes) -- não duplica credencial nova, e como o SecretStore
# vive no MESMO namespace (whatsnewsocp-policies) não precisa de fromSecret pra alcançá-lo.
# Bound só em placement-local-cluster: é infra do hub, não replica pra nenhum spoke.
# OperatorPolicy (não ConfigurationPolicy simples) de propósito -- precisa esperar o CSV
# terminar de instalar antes de criar SecretStore/ExternalSecret (CRDs do próprio operator),
# senão "no matches for kind SecretStore" (mesmo bug já visto com UIPlugin no Lab 8).
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-eso-oauth-secrets
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-eso-oauth-namespace
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: external-secrets-operator
  - extraDependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: ConfigurationPolicy
      name: policy-eso-oauth-namespace
    objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1beta1
      kind: OperatorPolicy
      metadata:
        name: policy-eso-oauth-operator-install
      spec:
        complianceType: musthave
        remediationAction: enforce
        severity: critical
        subscription:
          channel: stable-v1
          name: openshift-external-secrets-operator
          namespace: external-secrets-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
          startingCSV: external-secrets-operator.v1.0.0
        upgradeApproval: Automatic
        versions: []
  - extraDependencies:
    - apiVersion: policy.open-cluster-management.io/v1beta1
      compliance: Compliant
      kind: OperatorPolicy
      name: policy-eso-oauth-operator-install
    objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-eso-oauth-operator-config
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: operator.openshift.io/v1alpha1
            kind: ExternalSecretsConfig
            metadata:
              labels:
                app: external-secrets-operator
                app.kubernetes.io/name: cluster
              name: cluster
            spec:
              controllerConfig:
                networkPolicies:
                - componentName: ExternalSecretsCoreController
                  egress:
                  - {}
                  name: allow-external-secrets-egress
  - extraDependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: ConfigurationPolicy
      name: policy-eso-oauth-operator-config
    objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-eso-oauth-secretstore
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: azure-store
              namespace: whatsnewsocp-policies
            spec:
              provider:
                azurekv:
                  authType: ServicePrincipal
                  environmentType: PublicCloud
                  vaultUrl: "https://<KEYVAULT_NAME>.vault.azure.net"
                  tenantId: "<AZURE_TENANT_ID>"
                  authSecretRef:
                    clientId:
                      name: azure-eso-spn
                      key: ClientID
                    clientSecret:
                      name: azure-eso-spn
                      key: ClientSecret
  - extraDependencies:
    - apiVersion: policy.open-cluster-management.io/v1
      compliance: Compliant
      kind: ConfigurationPolicy
      name: policy-eso-oauth-secretstore
    objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-eso-oauth-external-secrets
      spec:
        remediationAction: enforce
        severity: medium
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: htpasswd-secret-es
              namespace: whatsnewsocp-policies
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: azure-store
                kind: SecretStore
              target:
                name: htpasswd-2cr76
                creationPolicy: Owner
              data:
                - secretKey: htpasswd
                  remoteRef:
                    key: whatsnewsocp-htpasswd
        - complianceType: musthave
          objectDefinition:
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: aad-client-secret-es
              namespace: whatsnewsocp-policies
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: azure-store
                kind: SecretStore
              target:
                name: aad-client-secret
                creationPolicy: Owner
              data:
                - secretKey: clientSecret
                  remoteRef:
                    key: whatsnewsocp-aad-client-secret
