# Lab 6 - PolicyScopeLabels: a lição é o 04-policy-as-code-example.yaml (escopo por label).
# Namespaces prod/dev + deployment com tag latest são só prep.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab06-policy-scope-labels-baseline
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab06-policy-scope-labels-baseline
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-acs-scope-prod
              labels:
                environment: production
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-acs-scope-dev
              labels:
                environment: development
        # O lab aplica o mesmo manifesto duas vezes (oc apply -n prod / oc apply -n dev), então
        # a policy precisa dos dois object-templates com namespace explícito.
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app-latest-tag
              namespace: lab-acs-scope-prod
              labels:
                app: app-latest-tag
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: app-latest-tag
              template:
                metadata:
                  labels:
                    app: app-latest-tag
                spec:
                  containers:
                    - name: app
                      # Usa a tag "latest" de propósito, para violar a política padrão
                      # "Latest tag" e servir de alvo de teste do escopo da política.
                      image: docker.io/library/nginx:latest
                      ports:
                        - containerPort: 80
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: app-latest-tag
              namespace: lab-acs-scope-dev
              labels:
                app: app-latest-tag
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: app-latest-tag
              template:
                metadata:
                  labels:
                    app: app-latest-tag
                spec:
                  containers:
                    - name: app
                      image: docker.io/library/nginx:latest
                      ports:
                        - containerPort: 80
