# Lab 9 - UpgradeRecommendPrecheck: a lição é corrigir o PDB e ver o precheck do
# oc adm upgrade recommend refletir a mudança. Namespace + deployment são boilerplate normal.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-lab09-upgrade-recommend-precheck-baseline
  namespace: whatsnewsocp-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
    policy.open-cluster-management.io/standards: NIST SP 800-53
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: policy-lab09-upgrade-recommend-precheck-baseline
      spec:
        remediationAction: enforce
        severity: low
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: lab-upgrade-status
        - complianceType: musthave
          objectDefinition:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: nginx-pdb-demo
              namespace: lab-upgrade-status
            spec:
              replicas: 3
              selector:
                matchLabels:
                  app: nginx-pdb-demo
              template:
                metadata:
                  labels:
                    app: nginx-pdb-demo
                spec:
                  containers:
                    - name: nginx
                      image: quay.io/packit/nginx-unprivileged:latest
                      ports:
                        - containerPort: 8080
