# Qualquer managed cluster OpenShift na Azure, hub incluído — sem exigir whatsnewsocp-lab
# (isso é diferente de "lab clusters na Azure"; se precisar de um placement só pra clusters
# de lab que sejam Azure, crie um novo em vez de reusar este).
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-azure
  namespace: policies-acm
spec:
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            cloud: Azure
            vendor: OpenShift
