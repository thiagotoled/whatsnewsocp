# Isso NÃO cria uma segunda Application -- é o MESMO ApplicationSet "appdemo" do
# 01-appset-push-model.yaml, reaplicado com o campo destination trocado. `oc apply` sobre um
# objeto com o mesmo apiVersion/kind/namespace/name atualiza em vez de criar; a Application
# derivada (appdemo-{{name}}) também é atualizada em vez de duplicada -- por isso o nome do
# ApplicationSet e o template.metadata.name aqui são idênticos ao manifesto do Passo 1.
#
# Confirmado no guia oficial (RHACM 2.17 GitOps, seção 1.11): em modo agent, o principal usa
# "destination-based mapping" (destinationBasedMapping: true na ArgoCD do hub, ver
# 03-argocd-agent-mode.yaml) para rotear pelo NOME do managed cluster, sem load balancer nem
# query param nenhum -- diferente do que uma primeira pesquisa (sem a doc oficial) sugeria.
# Quem efetivamente puxa e aplica é o agent rodando NO managed cluster, não o Argo CD do hub.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appdemo
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: placement-argocd-agent-demo
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'appdemo-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/thiagotoled/whatsnewsocp.git
        targetRevision: main
        path: 08-GitOpsArgoAgent/manifests/app
      destination:
        name: '{{name}}'
        namespace: gitops-agent-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
