# Modelo tradicional (push): Argo CD no hub conecta direto no managed cluster via cluster
# secret. Mesma mecânica de qualquer app hub-spoke já feita no ACM (ex.: AppDemo).
#
# O ApplicationSet se chama "appdemo" (não "appdemo-push") de propósito: a Application gerada
# (appdemo-{{name}}) é a MESMA que vira pull no Passo 4 -- não são duas Applications separadas
# disputando o mesmo Deployment/namespace no managed cluster (isso gera SharedResourceWarning
# no Argo CD, confirmado ao vivo). É uma "sequência", não uma "comparação lado a lado" -- o
# Passo 3 mostra o push quebrando com a rede caída, o Passo 5 mostra a MESMA app, já convertida
# pra pull, sobrevivendo à mesma queda de rede.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appdemo
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: placement-argocd-agent-demo
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'appdemo-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/thiagotoled/whatsnewsocp.git
        targetRevision: main
        path: 08-GitOpsArgoAgent/manifests/app
      destination:
        server: '{{server}}'
        namespace: gitops-agent-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-placement
  namespace: openshift-gitops
data:
  apiVersion: cluster.open-cluster-management.io/v1beta1
  kind: placementdecisions
  matchKey: clusterName
  statusListKey: decisions
---
# Placement puro pra targeting de Application -- diferente do Placement usado com Policy,
# este não precisa de PlacementBinding nenhum: o generator clusterDecisionResource já lê
# direto a PlacementDecision que o controller do Placement gera e rotula automaticamente
# com cluster.open-cluster-management.io/placement=<nome-do-placement>.
#
# Versão pra turma inteira (padrão): seleciona todo managed cluster rotulado
# whatsnewsocp-lab=true. Pra testar sozinho contra só o hub (local-cluster), troque o
# matchLabels abaixo por matchExpressions: key: name, operator: In, values: [local-cluster] --
# confirmado ao vivo que funciona igual, só reduz o escopo.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-argocd-agent-demo
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            whatsnewsocp-lab: "true"
