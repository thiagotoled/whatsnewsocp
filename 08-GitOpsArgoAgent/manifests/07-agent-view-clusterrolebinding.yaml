# Reescrito após teste ao vivo: a primeira versão deste arquivo usava a ClusterRole "view"
# (genérica) e assumia que o SA do agent vivia no namespace openshift-gitops. Os dois estavam
# errados:
#
# 1. O SA real é acm-openshift-gitops-agent-agent, no namespace local-cluster (o namespace que
#    o ACM cria no hub para o managed cluster "local-cluster" -- em ambiente de 1 cluster só,
#    hub e managed cluster são o mesmo, então esse SA aparece no hub mesmo).
# 2. A ClusterRole "view" built-in NÃO cobre applications.argoproj.io/appprojects/
#    applicationsets -- essas CRDs não têm o label rbac.authorization.k8s.io/aggregate-to-view.
#    Sem acesso explícito a esses recursos, o processo do agent CRASHA no startup:
#    "[FATAL]: Could not start agent: applications.argoproj.io is forbidden: ... cannot list
#    resource \"applications\" ... at the cluster scope" -- confirmado ao vivo
#    (CrashLoopBackOff).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-agent-argoproj-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs:
      - get
      - list
      - watch
---
# Precisa ser um objeto de Policy (não um ClusterRoleBinding aplicado direto) pra replicar pros
# managed clusters selecionados pelo Placement -- é assim que o guia oficial descreve, editando
# a Policy que o próprio GitOpsCluster já gera automaticamente (<nome-do-gitopscluster>-argocd-
# policy). Aqui está como uma Policy própria, aplicando o mesmo efeito.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitops-agent-clusters-view-rbac-policy
  namespace: openshift-gitops
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-agent-clusters-view-rbac-config-policy
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: acm-openshift-gitops-argocd-agent-cluster-reader
                subjects:
                  - kind: ServiceAccount
                    name: acm-openshift-gitops-agent-agent
                    namespace: local-cluster
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: view
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: acm-openshift-gitops-argocd-agent-argoproj-reader
                subjects:
                  - kind: ServiceAccount
                    name: acm-openshift-gitops-agent-agent
                    namespace: local-cluster
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: argocd-agent-argoproj-reader
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: gitops-agent-clusters-view-rbac-binding
  namespace: openshift-gitops
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-argocd-agent-demo
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: gitops-agent-clusters-view-rbac-policy
