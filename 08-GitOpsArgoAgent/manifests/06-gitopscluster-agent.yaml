# Este é o objeto que de fato liga o addon -- não é clusteradm install hub-addon (isso não
# existe no fluxo documentado oficialmente pro ACM 2.17). O controller do GitOpsCluster faz a
# gestão automática de PKI e implanta o Argo CD Agent em cada managed cluster selecionado pelo
# Placement referenciado. Confirmado no guia oficial (RHACM 2.17 GitOps, seção 1.11).
# Reusa o mesmo Placement do ApplicationSet (01-appset-push-model.yaml) -- os mesmos clusters
# rotulados whatsnewsocp-lab=true recebem o agent.
#
# ATENÇÃO pra não confundir os dois campos abaixo, que fazem coisas diferentes:
#
# - argoServer.cluster: local-cluster -- NÃO é o alvo do fan-out. É só onde o Argo CD/principal
#   em si roda (o hub), que sempre se autorregistra no próprio ACM como "local-cluster" -- vale
#   isso mesmo com N managed clusters recebendo o agent. Confirmado ao vivo que esse campo é
#   necessário (sem ele o GitOpsCluster ainda fica Ready, mas o ambiente de referência do time
#   sempre tem ele setado).
# - placementRef (abaixo) -- esse sim é quem decide o fan-out: aponta pro Placement
#   placement-argocd-agent-demo, com matchLabels whatsnewsocp-lab=true, cobrindo os managed
#   clusters de TODOS os alunos rotulados, não só o hub.
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: gitops-agent-clusters
  namespace: openshift-gitops
spec:
  argoServer:
    argoNamespace: openshift-gitops
    cluster: local-cluster
  placementRef:
    kind: Placement
    apiVersion: cluster.open-cluster-management.io/v1beta1
    name: placement-argocd-agent-demo
    namespace: openshift-gitops
  gitopsAddon:
    enabled: true
    argoCDAgent:
      enabled: true
      mode: managed
