# Pré-requisito do Passo 1 (não é só do Agent/pull) -- o generator clusterDecisionResource do
# ApplicationSet (01-appset-push-model.yaml) precisa ler PlacementDecisions pra saber quais
# clusters usar. Sem isso a ApplicationSet fica sem gerar nenhuma Application, sem erro óbvio
# no `oc get applicationset` -- confirmado ao vivo, foi o motivo real do Passo 1 falhar antes de
# qualquer coisa relacionada ao Agent entrar em cena.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: applicationset-placement-reader
  namespace: openshift-gitops
rules:
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - placementdecisions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: applicationset-placement-reader
  namespace: openshift-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-applicationset-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: applicationset-placement-reader
