# NÃO aplique este arquivo com `oc apply -f` direto -- ele é só a referência do fragmento a
# ser mesclado no ArgoCD (openshift-gitops) que o operator já criou, via `oc patch --type=merge`
# (ver Passo 2b do README). Um `oc apply -f` de recurso inteiro re-escreveria o spec inteiro e
# apagaria campos que o operator já define (incluindo o controller tradicional), quebrando o
# Passo 1 (push) -- confirmado ao vivo: o controller tradicional PRECISA continuar habilitado
# pro modelo push do lab continuar funcionando (é o ponto da "Hybrid Architecture": os dois
# modelos coexistindo na mesma instância). Por isso este fragmento não tem `controller.enabled`
# em lugar nenhum -- não mexemos nesse campo, só adicionamos o bloco argoCDAgent.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  sourceNamespaces:
    - '*'
  argoCDAgent:
    principal:
      enabled: true
      destinationBasedMapping: true
      auth: "mtls:CN=system:open-cluster-management:cluster:([^:]+):addon:gitops-addon:agent:gitops-addon-agent"
      namespace:
        allowedNamespaces:
          - '*'
      server:
        route:
          enabled: true
