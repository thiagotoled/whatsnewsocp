# Doc oficial (RHACM 2.17 GitOps, seção 1.11, passo 4): concede a ClusterRole "view" pro SA
# do Argo CD Agent em cada managed cluster -- sem isso o agent conecta mas não consegue ler o
# estado dos recursos que ele mesmo aplicou. A doc sugere editar a Policy que o GitOpsCluster
# já gera automaticamente; aqui está como uma Policy própria (mesmo Placement), mais simples
# de versionar em Git sem precisar buscar/editar um objeto gerado dinamicamente.
#
# Namespace do SA confirmado ao vivo como openshift-gitops (bate exatamente com a doc) -- só
# em teste anterior com hub=spoke esse SA apareceu num namespace diferente (local-cluster),
# artefato do cenário auto-referenciado que não existe com um managed cluster de verdade.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: gitops-agent-clusters-view-rbac-policy
  namespace: openshift-gitops
spec:
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: gitops-agent-clusters-view-rbac-config-policy
        spec:
          remediationAction: enforce
          severity: medium
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: acm-openshift-gitops-argocd-agent-cluster-reader
                subjects:
                  - kind: ServiceAccount
                    name: acm-openshift-gitops-agent-agent
                    namespace: openshift-gitops
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: view
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: gitops-agent-clusters-view-rbac-binding
  namespace: openshift-gitops
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: placement-argocd-agent-demo
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: gitops-agent-clusters-view-rbac-policy
