# App de exemplo B -- mesma imagem do app-a, de propósito: o ponto do lab é comparar os dois
# LoadBalancers/Gateways, não o conteúdo das respostas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  namespace: lab-gateway-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
        - name: app-b
          image: quay.io/openshift/origin-hello-openshift
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-b
  namespace: lab-gateway-demo
spec:
  selector:
    app: app-b
  ports:
    - port: 8080
      targetPort: 8080
