# App de exemplo A -- imagem "Hello OpenShift" oficial, usada nos próprios exemplos de Route
# da documentação do OCP. O conteúdo da resposta não importa pro lab; o que importa é qual
# Gateway/LoadBalancer você usou pra chegar nela.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: lab-gateway-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: quay.io/openshift/origin-hello-openshift
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-a
  namespace: lab-gateway-demo
spec:
  selector:
    app: app-a
  ports:
    - port: 8080
      targetPort: 8080
