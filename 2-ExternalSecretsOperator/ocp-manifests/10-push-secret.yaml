apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-local-secret-to-akv
  namespace: app
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
    - name: azure-kv-store
      kind: SecretStore
  selector:
    secret:
      name: source-secret
  data:
    - match:
        secretKey: password
        remoteRef:
          # Troque <SEU_NOME> pelo seu nome (só letras/números/hífen -- Key Vault não aceita
          # underscore no nome do secret). Se o Key Vault for compartilhado entre vários alunos
          # no curso, remoteKey igual = um aluno sobrescreve o secret do outro.
          remoteKey: minha-secret-na-keyvault-<SEU_NOME>
