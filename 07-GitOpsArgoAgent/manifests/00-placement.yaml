# Mesmo label whatsnewsocp-lab=true usado no placement-all-lab-clusters do acm-hub -- pega
# todo managed cluster real dos labs de uma vez, sem precisar editar nome de cluster. Não
# inclui local-cluster (não tem esse label) -- este lab precisa de um managed cluster de
# verdade, separado do hub. Aplicado pelo instrutor direto no hub, uma vez só.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: placement-argocd-agent-demo
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            whatsnewsocp-lab: "true"
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
# ConfigMap "duck-type" que o generator clusterDecisionResource do ApplicationSet lê --
# padrão exato da doc oficial (RHACM 2.17 GitOps, seção 1.6.3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: acm-placement
  namespace: openshift-gitops
data:
  apiVersion: cluster.open-cluster-management.io/v1beta1
  kind: placementdecisions
  matchKey: clusterName
  statusListKey: decisions
