# Confirmado ao vivo: siga a doc oficial à risca (RHACM 2.17 GitOps, seção 1.14) e aplique
# este arquivo INTEIRO com `oc apply -f` (a doc diz literalmente "Replace the existing ArgoCD
# custom resource") -- substitui a instância criada no 00-namespace.yaml, mesmo name/namespace.
# Repare no controller.enabled: false -- isso DESLIGA o controller tradicional DESTA
# instância dedicada (lab-argocd), não afeta a openshift-gitops de produção. A partir deste
# ponto, o push (Passo 1) para de funcionar nesta instância; não é "os dois modelos
# coexistindo", é uma MIGRAÇÃO. (Uma versão anterior deste lab tentou manter os dois ativos ao
# mesmo tempo via oc patch parcial -- design mais complexo que não reflete o que a doc
# realmente descreve.)
#
# Repete applicationSet/sso/rbac do 00-namespace.yaml de propósito -- como isso substitui o
# spec inteiro, omitir esses campos aqui apagaria SSO/RBAC/login da UI que já estava
# funcionando desde o Passo 0.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: lab-argocd
  namespace: lab-argocd
spec:
  applicationSet:
    enabled: true
  server:
    route:
      enabled: true
  sso:
    provider: dex
    dex:
      openShiftOAuth: true
  rbac:
    defaultPolicy: ""
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, admin, role:admin
      g, 6a758b5d-bbfb-498c-ae13-0cea9803de29, role:admin
    scopes: '[groups]'
  controller:
    enabled: false
  sourceNamespaces:
    - '*'
  argoCDAgent:
    principal:
      enabled: true
      destinationBasedMapping: true
      auth: "mtls:CN=system:open-cluster-management:cluster:([^:]+):addon:gitops-addon:agent:gitops-addon-agent"
      namespace:
        allowedNamespaces:
          - '*'
      server:
        route:
          enabled: true
