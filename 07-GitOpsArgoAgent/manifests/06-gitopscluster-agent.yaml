# Mesmo objeto do 01-gitopscluster-push.yaml (mesmo name/namespace) -- reaplicar com o bloco
# gitopsAddon adicionado atualiza em vez de criar. A partir daqui o controller do GitOpsCluster
# instala o addon (operator + ArgoCD Agent) no managed cluster selecionado pelo Placement.
#
# Confirmado ao vivo: depois de reaplicar, o controller (pod multicluster-integrations, no
# namespace open-cluster-management) às vezes fica com o status desatualizado ("addon
# disabled") até o próximo ciclo de reconciliação -- se isso acontecer, reinicie o pod:
# `oc delete pod -n open-cluster-management -l app=multicluster-integrations`
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  name: gitops-agent-clusters
  namespace: openshift-gitops
spec:
  argoServer:
    argoNamespace: openshift-gitops
  placementRef:
    kind: Placement
    apiVersion: cluster.open-cluster-management.io/v1beta1
    name: placement-argocd-agent-demo
    namespace: openshift-gitops
  gitopsAddon:
    enabled: true
    argoCDAgent:
      enabled: true
      mode: managed
