# Doc oficial (RHACM 2.17 GitOps, seção 1.14): sem sourceNamespaces com wildcard, o principal
# pula a propagação do AppProject "default" pros agents -- eles não acham a Application.
# clusterResourceWhitelist/destinations/sourceRepos com wildcard já vêm assim por padrão no
# AppProject "default" que o operator cria; sourceNamespaces geralmente falta -- confirmado
# ao vivo, precisou de patch explícito.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: lab-argocd
spec:
  sourceNamespaces:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - '*'
---
# Sem isso o Placement não acha nenhum managed cluster -- confirmado na doc oficial, seção
# 1.14, passo final.
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: lab-argocd
spec:
  clusterSet: default
