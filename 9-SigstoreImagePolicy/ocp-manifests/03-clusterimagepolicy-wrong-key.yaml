# Chave pública EC descartável, gerada só pra este lab (openssl ecparam -genkey -name
# prime256v1). Não corresponde à chave real que assinou a imagem — é exatamente o ponto:
# a verificação criptográfica vai falhar contra ela.
apiVersion: config.openshift.io/v1
kind: ClusterImagePolicy
metadata:
  name: lab-require-signature
spec:
  scopes:
    - registry.access.redhat.com/ubi9/ubi-micro
  policy:
    rootOfTrust:
      policyType: PublicKey
      publicKey:
        keyData: LS0tLS1CRUdJTiBQVUJMSUMgS0VZLS0tLS0KTUZrd0V3WUhLb1pJemowQ0FRWUlLb1pJemowREFRY0RRZ0FFemJIQjUxY3Rpc21wM2t0T2VLZ09KMmVZL2NqNgpwT3duL0ovaCtoNjBKOEZFekVVSVFzRStRMWNveXI0YlZBRjErUUFFQlkyWlkzajZSTEhVU3ZsdXV3PT0KLS0tLS1FTkQgUFVCTElDIEtFWS0tLS0tCg==
    signedIdentity:
      matchPolicy: MatchRepoDigestOrExact
