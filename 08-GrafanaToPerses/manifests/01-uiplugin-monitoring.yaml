# Corrigido ao vivo: a pesquisa original apontava apiVersion monitoring.rhobs/v1alpha2 e
# spec.type: monitoring (minúsculo) -- os dois errados. O CRD real (COO 1.5.1) é
# observability.openshift.io/v1alpha1, e o enum de spec.type é capitalizado (Monitoring),
# confirmado com `oc explain uiplugin.spec.type`.
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
spec:
  type: Monitoring
  monitoring:
    perses:
      enabled: true
