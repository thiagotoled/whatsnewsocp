apiVersion: v1
kind: ServiceAccount
metadata:
  name: userns-host-demo
  namespace: userns-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: userns-host-demo-anyuid
  namespace: userns-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
- kind: ServiceAccount
  name: userns-host-demo
  namespace: userns-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userns-demo-host
  namespace: userns-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userns-demo-host
  template:
    metadata:
      labels:
        app: userns-demo-host
    spec:
      serviceAccountName: userns-host-demo
      hostUsers: true
      containers:
        - name: demo
          image: registry.access.redhat.com/ubi9/ubi
          # SCC anyuid + runAsUser:0 de propósito -- sem isso o restricted-v2 (SCC padrão do
          # OpenShift) já força um UID não-root mesmo com hostUsers:true, e o lab perde a graça:
          # o ponto de comparação é rodar como root DE VERDADE dos dois lados, com e sem
          # isolamento de UID no host.
          securityContext:
            runAsUser: 0
          command:
            - /bin/bash
            - -c
            - |
              echo "=== id ==="
              id
              echo
              echo "=== uid_map ==="
              cat /proc/self/uid_map || true
              echo
              echo "=== gid_map ==="
              cat /proc/self/gid_map || true
              echo
              sleep 3600
