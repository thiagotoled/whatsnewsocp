# "Hoje": como se cria um dashboard customizado no ACM agora -- um ConfigMap rotulado
# grafana-custom-dashboard: "true" no namespace de observability do hub, com o JSON do
# dashboard do Grafana dentro. Este é um dashboard real (uso de vCPU dos workers em toda a
# frota de managed clusters, por vendor/cloud, usando o metric acm_managed_cluster_labels que
# só existe no hub).
#
# Troque <SEU_NOME> pelo seu nome (só letras/números/hífen -- é metadata.name de um ConfigMap,
# vale a mesma regra de nome de recurso Kubernetes) antes de aplicar -- o namespace é
# compartilhado pela turma inteira.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-worker-vcpu-<SEU_NOME>
  namespace: open-cluster-management-observability
  labels:
    grafana-custom-dashboard: "true"
data:
  worker-vcpu-dashboard.json: |-
    {
      "id": null,
      "uid": "acm-worker-vcpu-<SEU_NOME>",
      "title": "ACM - Worker Nodes vCPU Capacity (<SEU_NOME>)",
      "description": "Total vCPU capacity of worker nodes across RHACM managed clusters, grouped by cluster, vendor (OpenShift/AKS) and cloud. Uses kube_node_status_capacity (excluding *-master-* nodes) joined with acm_managed_cluster_labels.",
      "tags": ["acm", "observability", "capacity", "vcpu"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "5m",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          { "name": "datasource", "type": "datasource", "label": "Datasource", "query": "prometheus", "current": {}, "hide": 0, "refresh": 1 },
          { "name": "cluster", "type": "query", "label": "Managed Cluster", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(kube_node_status_capacity{resource=\"cpu\"}, cluster)", "refresh": 2, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}, "sort": 1 },
          { "name": "vendor", "type": "query", "label": "Vendor", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(acm_managed_cluster_labels, vendor)", "refresh": 2, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}, "sort": 1 },
          { "name": "cloud", "type": "query", "label": "Cloud", "datasource": {"type": "prometheus", "uid": "${datasource}"}, "query": "label_values(acm_managed_cluster_labels, cloud)", "refresh": 2, "includeAll": true, "multi": true, "current": {"text": "All", "value": "$__all"}, "sort": 1 }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Total Worker vCPU (All Clusters)",
          "gridPos": {"h": 5, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "targets": [{"refId": "A", "instant": true, "range": false, "expr": "sum(\n  kube_node_status_capacity{resource=\"cpu\", node!~\".*-master-.*\", cluster=~\"$cluster\"}\n  * on(cluster) group_left(vendor, cloud)\n  label_replace(acm_managed_cluster_labels{vendor=~\"$vendor\", cloud=~\"$cloud\"}, \"cluster\", \"$1\", \"name\", \"(.*)\")\n)", "legendFormat": "Total worker vCPU"}]
        },
        {
          "id": 2, "type": "stat", "title": "Total Worker Nodes",
          "gridPos": {"h": 5, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto", "textMode": "auto", "colorMode": "value", "graphMode": "none", "justifyMode": "auto"},
          "targets": [{"refId": "A", "instant": true, "range": false, "expr": "count(\n  kube_node_status_capacity{resource=\"cpu\", node!~\".*-master-.*\", cluster=~\"$cluster\"}\n  * on(cluster) group_left(vendor, cloud)\n  label_replace(acm_managed_cluster_labels{vendor=~\"$vendor\", cloud=~\"$cloud\"}, \"cluster\", \"$1\", \"name\", \"(.*)\")\n)", "legendFormat": "Worker node count"}]
        },
        {
          "id": 4, "type": "table", "title": "Worker vCPU by Cluster",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"showHeader": true},
          "targets": [{"refId": "A", "format": "table", "instant": true, "expr": "sum by (cluster, vendor, cloud) (\n  kube_node_status_capacity{resource=\"cpu\", node!~\".*-master-.*\", cluster=~\"$cluster\"}\n  * on(cluster) group_left(vendor, cloud)\n  label_replace(acm_managed_cluster_labels{vendor=~\"$vendor\", cloud=~\"$cloud\"}, \"cluster\", \"$1\", \"name\", \"(.*)\")\n)", "legendFormat": "{{cluster}}"}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}]
        }
      ]
    }
